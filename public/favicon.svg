<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DBFFF" />
      <stop offset="50%" stop-color="#923FFF" />
      <stop offset="100%" stop-color="#583FFF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#923FFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7DBFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A0814" stroke="url(#brandGrad)" stroke-width="2" />
  
  <!-- Subtle inner background highlight -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glowGrad)" opacity="0.15" />

  <!-- Monogram AZ -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M16 46 L26 18 L36 46 M20 37 L32 37" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter Z -->
    <path d="M36 24 L48 24 L36 44 L48 44" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dot accent -->
    <circle cx="49" cy="20" r="2.5" fill="#7DBFFF" />
  </g>
</svg>
